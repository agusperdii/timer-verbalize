<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parliamentary Debate Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #141b2d;
    --border: #2a3349;
    --text: #f5f5f4;
    --muted: #94a3b8;
    --accent: #fbbf24;

    --state-protected: #dc2626;
    --state-normal: #16a34a;
    --state-warning: #ea580c;
    --state-overtime: #b91c1c;
    --state-exceeded: #450a0a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background-color 0.4s ease;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle grid background for format selection */
  #screen-format::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* === FORMAT SELECTION === */
  #screen-format {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    position: relative;
    z-index: 1;
  }

  .brand { text-align: center; margin-bottom: 3.5rem; }

  .brand .eyebrow {
    font-size: 0.875rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 800;
    margin-bottom: 1rem;
  }

  .brand h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(2.5rem, 7vw, 5rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
  }

  .brand p {
    margin-top: 1rem;
    color: var(--muted);
    font-size: 1.05rem;
  }

  .format-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.25rem;
    width: 100%;
    max-width: 1100px;
  }

  .format-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 1.25rem;
    padding: 2rem;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: left;
    color: var(--text);
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }

  .format-card::after {
    content: '→';
    position: absolute;
    bottom: 1.5rem;
    right: 1.75rem;
    font-size: 1.5rem;
    color: var(--muted);
    transition: all 0.25s;
  }

  .format-card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
  }

  .format-card:hover::after {
    color: var(--accent);
    transform: translateX(4px);
  }

  .format-card .tag {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 800;
    margin-bottom: 1rem;
  }

  .format-card h2 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.75rem;
    line-height: 1;
    margin-bottom: 0.75rem;
  }

  .format-card .meta {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.55;
    margin-bottom: 1.5rem;
  }

  .format-card .stats {
    display: flex;
    gap: 1.75rem;
    border-top: 1px solid var(--border);
    padding-top: 1.25rem;
  }

  .format-card .stat-num {
    font-family: 'Anton', sans-serif;
    font-size: 2.1rem;
    line-height: 1;
  }

  .format-card .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 0.35rem;
    font-weight: 700;
  }

  /* === TIMER SCREEN === */
  #screen-timer {
    min-height: 100vh;
    display: none;
    flex-direction: column;
    padding: 1.5rem 2rem;
  }

  #screen-timer.active { display: flex; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .top-bar .left {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    flex-wrap: wrap;
  }

  .icon-btn {
    background: rgba(0,0,0,0.25);
    border: 1.5px solid rgba(255,255,255,0.35);
    color: white;
    padding: 0.625rem 1.125rem;
    border-radius: 0.5rem;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }

  .icon-btn:hover {
    background: rgba(0,0,0,0.45);
    border-color: white;
  }

  .format-badge {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
  }

  .speaker-progress {
    font-family: 'Anton', sans-serif;
    font-size: 1.75rem;
    letter-spacing: 0.05em;
  }

  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 0.75rem;
  }

  .speaker-info { margin-bottom: 0.25rem; }

  .speaker-team {
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.92;
    margin-bottom: 0.5rem;
    font-weight: 800;
  }

  .speaker-name {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .timer-display {
    font-family: 'Anton', sans-serif;
    font-size: clamp(8rem, 28vw, 24rem);
    line-height: 0.85;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    margin: 0.5rem 0;
    text-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  .max-display {
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0.85;
    font-weight: 800;
  }

  .max-display strong {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
    margin-left: 0.5rem;
  }

  .controls {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 1.25rem;
  }

  .control-btn {
    background: rgba(255,255,255,0.95);
    color: #0a0e1a;
    border: none;
    padding: 1rem 2rem;
    font-family: 'Archivo Black', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 140px;
  }

  .control-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .control-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .control-btn.primary {
    background: var(--accent);
  }

  .control-btn.outline {
    background: transparent;
    color: white;
    border: 2px solid rgba(255,255,255,0.55);
  }

  .control-btn.outline:hover:not(:disabled) {
    border-color: white;
    background: rgba(255,255,255,0.12);
  }

  /* POI button */
  .poi-row {
    display: flex;
    justify-content: center;
    margin-top: 0.85rem;
  }

  .poi-btn {
    background: rgba(0,0,0,0.3);
    color: white;
    border: 2px solid rgba(255,255,255,0.55);
    padding: 0.875rem 2rem;
    font-family: 'Archivo Black', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s, border-color 0.15s;
    min-width: 220px;
    font-variant-numeric: tabular-nums;
    position: relative;
    overflow: hidden;
  }

  .poi-btn:hover:not(:disabled) {
    border-color: white;
    background: rgba(0,0,0,0.5);
    transform: translateY(-2px);
  }

  .poi-btn:disabled { cursor: not-allowed; }

  .poi-btn.active {
    background: white;
    color: #0a0e1a;
    border-color: white;
    animation: poiPulse 1.1s ease-in-out infinite;
  }

  .poi-btn.cooldown {
    opacity: 0.55;
    background: rgba(0,0,0,0.45);
  }

  .poi-btn.locked {
    opacity: 0.4;
    background: rgba(0,0,0,0.4);
    border-color: rgba(255,255,255,0.25);
    border-style: dashed;
  }

  /* Progress fill that drains while POI is active */
  .poi-btn .poi-progress {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.18);
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 1s linear;
    pointer-events: none;
  }

  .poi-btn.active .poi-progress { background: rgba(220, 38, 38, 0.28); }

  .poi-btn .poi-label { position: relative; z-index: 1; }

  @keyframes poiPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.55); }
    50%      { box-shadow: 0 0 0 14px rgba(255,255,255,0); }
  }

  .speaker-queue {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    padding-top: 1.5rem;
  }

  .queue-dot {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.5rem;
    background: rgba(0,0,0,0.25);
    border: 2px solid rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Anton', sans-serif;
    font-size: 1.15rem;
    cursor: pointer;
    transition: all 0.15s;
    color: white;
    user-select: none;
  }

  .queue-dot:hover { border-color: white; }

  .queue-dot.done {
    background: rgba(0,0,0,0.45);
    opacity: 0.55;
  }

  .queue-dot.current {
    background: white;
    color: #0a0e1a;
    border-color: white;
    transform: scale(1.18);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }

  /* State coloring on body */
  body.timer-active.state-protected { background-color: var(--state-protected); }
  body.timer-active.state-normal { background-color: var(--state-normal); }
  body.timer-active.state-warning { background-color: var(--state-warning); }
  body.timer-active.state-overtime { background-color: var(--state-overtime); }
  body.timer-active.state-exceeded { background-color: var(--state-exceeded); }

  /* When exceeded — pulse the timer */
  body.state-exceeded.running .timer-display {
    animation: alertFlash 0.8s ease-in-out infinite;
  }

  @keyframes alertFlash {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.02); }
  }

  .hint {
    text-align: center;
    margin-top: 0.5rem;
    font-size: 0.7rem;
    opacity: 0.7;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 700;
  }

  /* Responsive */
  @media (max-width: 640px) {
    #screen-timer { padding: 1rem; }
    .control-btn { min-width: 100px; padding: 0.875rem 1rem; font-size: 0.8rem; }
    .queue-dot { width: 2.25rem; height: 2.25rem; font-size: 0.95rem; }
    .speaker-team { font-size: 0.7rem; }
    .top-bar { justify-content: center; }
  }
</style>
</head>
<body>

<!-- ============ SCREEN 1: FORMAT SELECTION ============ -->
<section id="screen-format">
  <div class="brand">
    <div class="eyebrow">Parliamentary Debate</div>
    <h1>DEBATE<br>TIMER</h1>
    <p>Pilih format debat untuk memulai sesi</p>
  </div>

  <div class="format-grid">
    <button class="format-card" data-format="british">
      <div class="tag">8 Speakers · 4 Teams</div>
      <h2>British Parliamentary</h2>
      <p class="meta">OG, OO, CG, CO. Format adu argumen klasik dengan delapan pembicara dari empat sisi meja.</p>
      <div class="stats">
        <div>
          <div class="stat-num">7:20</div>
          <div class="stat-label">Max Speech</div>
        </div>
        <div>
          <div class="stat-num">8</div>
          <div class="stat-label">Speakers</div>
        </div>
      </div>
    </button>

    <button class="format-card" data-format="asian">
      <div class="tag">8 Speakers · 2 Teams</div>
      <h2>Asian Parliamentary</h2>
      <p class="meta">Government vs Opposition. Enam substantive speakers diikuti dua reply speakers di akhir debat.</p>
      <div class="stats">
        <div>
          <div class="stat-num">7:20</div>
          <div class="stat-label">Substantive</div>
        </div>
        <div>
          <div class="stat-num">4:20</div>
          <div class="stat-label">Reply</div>
        </div>
      </div>
    </button>

    <button class="format-card" data-format="wsdc">
      <div class="tag">8 Speakers · 2 Teams</div>
      <h2>WSDC Format</h2>
      <p class="meta">World Schools Debating Championships. Struktur Asian dengan speech lebih panjang dan reply lebih pendek.</p>
      <div class="stats">
        <div>
          <div class="stat-num">8:20</div>
          <div class="stat-label">Substantive</div>
        </div>
        <div>
          <div class="stat-num">4:00</div>
          <div class="stat-label">Reply</div>
        </div>
      </div>
    </button>
  </div>
</section>

<!-- ============ SCREEN 2: TIMER ============ -->
<section id="screen-timer">
  <div class="top-bar">
    <div class="left">
      <button class="icon-btn" id="back-btn">← Formats</button>
      <span class="format-badge" id="format-badge">—</span>
    </div>
    <div class="speaker-progress">
      <span id="current-num">1</span> / <span id="total-num">8</span>
    </div>
  </div>

  <div class="main-area">
    <div class="speaker-info">
      <div class="speaker-team" id="speaker-team">OPENING GOVERNMENT</div>
      <div class="speaker-name" id="speaker-name">Prime Minister</div>
    </div>

    <div class="timer-display" id="timer-display">0:00</div>

    <div class="max-display">
      Max Time <strong id="max-display">7:20</strong>
    </div>

    <div class="controls">
      <button class="control-btn primary" id="start-btn">Start</button>
      <button class="control-btn outline" id="pause-btn">Pause</button>
      <button class="control-btn outline" id="reset-btn">Reset</button>
      <button class="control-btn outline" id="next-btn">Next Speaker →</button>
    </div>

    <div class="poi-row">
      <button class="poi-btn" id="poi-btn">
        <span class="poi-progress" id="poi-progress"></span>
        <span class="poi-label" id="poi-label">POI</span>
      </button>
    </div>

    <div class="hint">Space: Start/Pause · R: Reset · N: Next · P: POI · Esc: Back</div>
  </div>

  <div class="speaker-queue" id="speaker-queue"></div>
</section>

<script>
/* ===== PRESET TIMING DEFINITIONS =====
   thresholds = end-of-state boundaries in seconds.
     0..protected   → red (protected time)
     protected..normal → green
     normal..warning   → orange
     warning..overtime → red
     overtime..∞        → dark red (exceeded)
*/
const PRESETS = {
  // British & Asian substantive: 7:20 max
  main720: {
    maxSeconds: 440,
    thresholds: { protected: 60, normal: 360, warning: 420, overtime: 440 }
  },
  // Asian reply: 4:20 max
  reply420: {
    maxSeconds: 260,
    thresholds: { protected: 30, normal: 180, warning: 240, overtime: 260 }
  },
  // WSDC substantive: 8:20 max
  main820: {
    maxSeconds: 500,
    thresholds: { protected: 60, normal: 420, warning: 480, overtime: 500 }
  },
  // WSDC reply: 4:00 max
  reply400: {
    maxSeconds: 240,
    thresholds: { protected: 30, normal: 180, warning: 240, overtime: 240 }
  }
};

const FORMATS = {
  british: {
    name: 'British Parliamentary',
    speakers: [
      { name: 'Prime Minister',             team: 'Opening Government',    preset: 'main720' },
      { name: 'Leader of Opposition',       team: 'Opening Opposition',    preset: 'main720' },
      { name: 'Deputy Prime Minister',      team: 'Opening Government',    preset: 'main720' },
      { name: 'Deputy Leader of Opposition',team: 'Opening Opposition',    preset: 'main720' },
      { name: 'Member of Government',       team: 'Closing Government',    preset: 'main720' },
      { name: 'Member of Opposition',       team: 'Closing Opposition',    preset: 'main720' },
      { name: 'Government Whip',            team: 'Closing Government',    preset: 'main720' },
      { name: 'Opposition Whip',            team: 'Closing Opposition',    preset: 'main720' }
    ]
  },
  asian: {
    name: 'Asian Parliamentary',
    speakers: [
      { name: 'Prime Minister',              team: 'Government',           preset: 'main720' },
      { name: 'Leader of Opposition',        team: 'Opposition',           preset: 'main720' },
      { name: 'Deputy Prime Minister',       team: 'Government',           preset: 'main720' },
      { name: 'Deputy Leader of Opposition', team: 'Opposition',           preset: 'main720' },
      { name: 'Government Whip',             team: 'Government',           preset: 'main720' },
      { name: 'Opposition Whip',             team: 'Opposition',           preset: 'main720' },
      { name: 'Reply Opposition',            team: 'Opposition · Reply',   preset: 'reply420' },
      { name: 'Reply Government',            team: 'Government · Reply',   preset: 'reply420' }
    ]
  },
  wsdc: {
    name: 'WSDC Format',
    speakers: [
      { name: 'Prime Minister',              team: 'Government',           preset: 'main820' },
      { name: 'Leader of Opposition',        team: 'Opposition',           preset: 'main820' },
      { name: 'Deputy Prime Minister',       team: 'Government',           preset: 'main820' },
      { name: 'Deputy Leader of Opposition', team: 'Opposition',           preset: 'main820' },
      { name: 'Government Whip',             team: 'Government',           preset: 'main820' },
      { name: 'Opposition Whip',             team: 'Opposition',           preset: 'main820' },
      { name: 'Reply Opposition',            team: 'Opposition · Reply',   preset: 'reply400' },
      { name: 'Reply Government',            team: 'Government · Reply',   preset: 'reply400' }
    ]
  }
};

/* ===== STATE ===== */
const state = {
  formatKey: null,
  speakerIndex: 0,
  elapsed: 0,
  running: false,
  intervalId: null,
  bellsRung: new Set(),
  audioCtx: null,
  poi: {
    active: false,        // POI countdown is running (within the 15s)
    remaining: 0,         // seconds left of the 15s POI
    cooldown: 0,          // seconds left until button re-enables (counts from 20)
    intervalId: null
  }
};

const $ = id => document.getElementById(id);
const screenFormat = $('screen-format');
const screenTimer  = $('screen-timer');

/* ===== AUDIO (Web Audio synthesis) =====
   In your real project with teng.mp3 / over.mp3, replace the playBell()
   body with audio element playback. Example:
     document.getElementById('bell-sound').play();
*/
function ensureAudio() {
  if (!state.audioCtx) {
    try {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* audio unavailable */ }
  }
}

function playTone(freq, startOffset, duration, vol = 0.3) {
  if (!state.audioCtx) return;
  const ctx = state.audioCtx;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, now + startOffset);
  gain.gain.linearRampToValueAtTime(vol, now + startOffset + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, now + startOffset + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now + startOffset);
  osc.stop(now + startOffset + duration);
}

function playBell(type) {
  ensureAudio();
  if (!state.audioCtx) return;
  if (type === 'single')      { playTone(880, 0, 0.55); }
  else if (type === 'double') { playTone(880, 0, 0.4); playTone(880, 0.45, 0.55); }
  else if (type === 'alarm')  {
    playTone(660, 0,    0.18);
    playTone(880, 0.22, 0.18);
    playTone(660, 0.45, 0.18);
    playTone(880, 0.67, 0.5);
  }
}

/* ===== HELPERS ===== */
function fmtTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function currentSpeaker() {
  return FORMATS[state.formatKey].speakers[state.speakerIndex];
}

function currentPreset() {
  return PRESETS[currentSpeaker().preset];
}

function getStateName(elapsed, preset) {
  const t = preset.thresholds;
  if (elapsed < t.protected) return 'protected';
  if (elapsed < t.normal)    return 'normal';
  if (elapsed < t.warning)   return 'warning';
  if (elapsed < t.overtime)  return 'overtime';
  return 'exceeded';
}

/* ===== RENDERING ===== */
function render() {
  if (!state.formatKey) return;
  const fmt     = FORMATS[state.formatKey];
  const speaker = currentSpeaker();
  const preset  = currentPreset();

  $('format-badge').textContent  = fmt.name;
  $('current-num').textContent   = state.speakerIndex + 1;
  $('total-num').textContent     = fmt.speakers.length;
  $('speaker-name').textContent  = speaker.name;
  $('speaker-team').textContent  = speaker.team.toUpperCase();
  $('max-display').textContent   = fmtTime(preset.maxSeconds);
  $('timer-display').textContent = fmtTime(state.elapsed);

  document.body.classList.remove('state-protected','state-normal','state-warning','state-overtime','state-exceeded');
  document.body.classList.add('state-' + getStateName(state.elapsed, preset));
  document.body.classList.toggle('running', state.running);

  $('start-btn').disabled    = state.running;
  $('start-btn').textContent = state.running ? 'Running' : 'Start';

  renderQueue();
  renderPOI();
}

function renderQueue() {
  const fmt = FORMATS[state.formatKey];
  const queue = $('speaker-queue');
  queue.innerHTML = '';
  fmt.speakers.forEach((sp, i) => {
    const dot = document.createElement('div');
    dot.className = 'queue-dot';
    if (i <  state.speakerIndex) dot.classList.add('done');
    if (i === state.speakerIndex) dot.classList.add('current');
    dot.textContent = i + 1;
    dot.title = `${sp.name} — ${sp.team}`;
    dot.addEventListener('click', () => jumpToSpeaker(i));
    queue.appendChild(dot);
  });
}

/* ===== TIMER LOGIC ===== */
function tick() {
  state.elapsed += 1;

  // Bell logic — fires when elapsed crosses a threshold for the first time this speech
  const t = currentPreset().thresholds;
  const checks = [
    { time: t.protected, type: 'single' },  // protected time ends
    { time: t.normal,    type: 'single' },  // warning approaching end
    { time: t.warning,   type: 'double' },  // end of normal time
    { time: t.overtime,  type: 'alarm'  }   // max time exceeded
  ];
  checks.forEach(c => {
    if (state.elapsed === c.time && !state.bellsRung.has(c.time)) {
      state.bellsRung.add(c.time);
      playBell(c.type);
    }
  });

  render();
}

function start() {
  if (state.running) return;
  ensureAudio();
  state.running = true;
  state.intervalId = setInterval(tick, 1000);
  render();
}

function pause() {
  state.running = false;
  if (state.intervalId) { clearInterval(state.intervalId); state.intervalId = null; }
  render();
}

function reset() {
  pause();
  state.elapsed = 0;
  state.bellsRung.clear();
  resetPOI();
  render();
}

/* ===== POI LOGIC =====
   Press POI → 15s countdown begins, button disabled for 20s total
   (15s POI + 5s cooldown after POI ends). Independent of main timer.
*/
function startPOI() {
  if (state.poi.active || state.poi.cooldown > 0) return;
  // Block POI when current speaker is a reply speaker, or outside the green zone
  const speaker = currentSpeaker();
  if (speaker.preset.startsWith('reply')) return;
  if (getStateName(state.elapsed, currentPreset()) !== 'normal') return;

  ensureAudio();
  state.poi.active    = true;
  state.poi.remaining = 15;
  state.poi.cooldown  = 35;   // 15s POI duration + 20s cooldown after
  state.poi.intervalId = setInterval(tickPOI, 1000);
  renderPOI();
}

function tickPOI() {
  state.poi.cooldown -= 1;
  if (state.poi.active) {
    state.poi.remaining -= 1;
    if (state.poi.remaining <= 0) {
      state.poi.active    = false;
      state.poi.remaining = 0;
      playPOIEnd();
    }
  }
  if (state.poi.cooldown <= 0) {
    state.poi.cooldown = 0;
    clearInterval(state.poi.intervalId);
    state.poi.intervalId = null;
  }
  renderPOI();
}

function resetPOI() {
  if (state.poi.intervalId) clearInterval(state.poi.intervalId);
  state.poi.intervalId = null;
  state.poi.active     = false;
  state.poi.remaining  = 0;
  state.poi.cooldown   = 0;
  renderPOI();
}

function renderPOI() {
  const row      = document.querySelector('.poi-row');
  const btn      = $('poi-btn');
  const label    = $('poi-label');
  const progress = $('poi-progress');

  // Hide POI entirely for reply speakers
  if (state.formatKey) {
    const speaker = currentSpeaker();
    if (speaker.preset.startsWith('reply')) {
      row.style.display = 'none';
      return;
    }
  }
  row.style.display = '';

  btn.classList.remove('active', 'cooldown', 'locked');

  if (state.poi.active) {
    btn.classList.add('active');
    label.textContent = `POI · ${state.poi.remaining}s`;
    btn.disabled = true;
    progress.style.transform = `scaleX(${state.poi.remaining / 15})`;
  } else if (state.poi.cooldown > 0) {
    btn.classList.add('cooldown');
    label.textContent = `Wait · ${state.poi.cooldown}s`;
    btn.disabled = true;
    progress.style.transform = 'scaleX(0)';
  } else {
    // POI only allowed during the green/normal zone of the current speech
    const stateName = state.formatKey
      ? getStateName(state.elapsed, currentPreset())
      : 'protected';
    if (stateName !== 'normal') {
      btn.classList.add('locked');
      label.textContent = 'POI · Locked';
      btn.disabled = true;
    } else {
      label.textContent = 'POI';
      btn.disabled = false;
    }
    progress.style.transform = 'scaleX(0)';
  }
}

function playPOIEnd() {
  // Short distinct chirp when POI window closes
  playTone(440, 0,    0.12, 0.22);
  playTone(660, 0.13, 0.18, 0.22);
}

function nextSpeaker() {
  const fmt = FORMATS[state.formatKey];
  if (state.speakerIndex < fmt.speakers.length - 1) {
    state.speakerIndex += 1;
    reset();
  }
}

function jumpToSpeaker(i) {
  state.speakerIndex = i;
  reset();
}

function openTimer(formatKey) {
  state.formatKey = formatKey;
  state.speakerIndex = 0;
  state.elapsed = 0;
  state.bellsRung.clear();
  pause();
  resetPOI();
  screenFormat.style.display = 'none';
  screenTimer.classList.add('active');
  document.body.classList.add('timer-active');
  render();
}

function backToFormat() {
  pause();
  resetPOI();
  screenTimer.classList.remove('active');
  screenFormat.style.display = '';
  document.body.classList.remove(
    'timer-active','running',
    'state-protected','state-normal','state-warning','state-overtime','state-exceeded'
  );
}

/* ===== EVENTS ===== */
document.querySelectorAll('.format-card').forEach(card => {
  card.addEventListener('click', () => openTimer(card.dataset.format));
});

$('back-btn').addEventListener('click', backToFormat);
$('start-btn').addEventListener('click', start);
$('pause-btn').addEventListener('click', pause);
$('reset-btn').addEventListener('click', reset);
$('next-btn').addEventListener('click', nextSpeaker);
$('poi-btn').addEventListener('click', startPOI);

document.addEventListener('keydown', (e) => {
  if (!screenTimer.classList.contains('active')) return;
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); state.running ? pause() : start(); }
  else if (e.key.toLowerCase() === 'r') reset();
  else if (e.key.toLowerCase() === 'n') nextSpeaker();
  else if (e.key.toLowerCase() === 'p') startPOI();
  else if (e.key === 'Escape')          backToFormat();
});
</script>
</body>
</html>
